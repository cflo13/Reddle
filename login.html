<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in · Reddle</title>
  <meta name="description" content="Log in to Reddle.">
  <link rel="stylesheet" href="css/style.css?v=7">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">Reddle</a>
    <!-- Search box: goes to search.html?q=... -->
    <form class="header-search" action="search.html" role="search">
      <input name="q" type="search" placeholder="Search books or people" aria-label="Search books or people">
    </form>
    <!-- Filled in by js/auth.js: log in links, or your picture and menu -->
    <nav id="site-nav" class="site-nav"></nav>
  </header>

  <main class="page page-narrow">
    <h1>Log in</h1>

    <form id="login-form" class="form">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <p class="hint"><a href="forgot-password.html">Forgot password?</a></p>

      <button type="submit" class="button">Log in</button>
    </form>

    <p class="divider">or</p>
    <button id="google-button" type="button" class="button button-secondary button-wide">Continue with Google</button>

    <p id="form-message" class="status" hidden></p>

    <p class="muted">New here? <a href="signup.html">Create an account</a></p>
  </main>

  <footer class="site-footer">
    <nav class="footer-links" aria-label="About Reddle">
      <a href="about.html">About</a>
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
      <a href="about.html#contact">Contact</a>
    </nav>
    <p class="footer-note">Book data and covers from <a href="https://openlibrary.org">Open Library</a>.</p>
  </footer>

  <!-- 1. Supabase library from a CDN (nothing to install) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <!-- 2. Our project URL and key -->
  <script src="js/config.js?v=7"></script>
  <!-- 3. Shared connection, available as `db` -->
  <script src="js/supabase-client.js?v=7"></script>
  <!-- 4. Login helpers, the header menu and shared helpers -->
  <script src="js/auth.js?v=7"></script>
  <!-- This page's own code -->
  <script src="js/login.js?v=7"></script>
</body>
</html>
