<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base href="./">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Spotlight · Reddle</title>
  <meta name="description" content="News and themes for Reddle readers, with books to try and a discussion.">
  <!-- Icon in the browser tab and on phone home screens -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="images/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <meta name="theme-color" content="#271f1a">
  <!-- Installable app: name, icons and colours (manifest), plus iPhone's own tags -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Reddle">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- The preview shown when a link is shared (WhatsApp, Instagram, iMessage...) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Reddle">
  <meta property="og:title" content="Spotlight · Reddle">
  <meta property="og:description" content="News and themes for Reddle readers, with books to try and a discussion.">
  <meta property="og:url" content="https://reddle.org/spotlight.html">
  <meta property="og:image" content="https://reddle.org/images/share.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Reddle: track the books you read">
  <meta name="twitter:card" content="summary_large_image">
  <script>
    // Day or night colours, before anything is drawn (so no flash):
    // your saved choice, otherwise the device setting. js/auth.js has the switch.
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("reddle-theme"); } catch (e) {}
      var light = saved ? saved === "light" : !!(window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches);
      document.documentElement.setAttribute("data-theme", light ? "light" : "dark");
      // Books, Comics or Manga (the switch is in the header).
      var universe = null;
      try { universe = localStorage.getItem("reddle-universe"); } catch (e) {}
      if (universe !== "comics" && universe !== "manga") universe = "books";
      document.documentElement.setAttribute("data-universe", universe);
      // Comics and Manga: start downloading the seed list straight away
      // (js/universe-seeds.js reads it).
      if (universe !== "books") {
        var preload = document.createElement("link");
        preload.rel = "preload";
        preload.as = "fetch";
        preload.crossOrigin = "anonymous";
        preload.href = "seeds-resolved.json?v=67";
        document.head.appendChild(preload);
      }
      // The phone's status bar matches the header (day, night).
      var bars = { books: ["#fbf5e6", "#271f1a"], comics: ["#ffffff", "#222845"], manga: ["#ffffff", "#171717"] };
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", bars[universe][light ? 0 : 1]);
    })();
  </script>
  <link rel="stylesheet" href="css/style.css?v=67">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html"><img src="favicon.svg" alt="" width="28" height="28">Reddle</a>
    <!-- Search box: goes to search.html?q=... -->
    <form class="header-search" action="search.html" role="search">
      <input name="q" type="search" enterkeyhint="search" placeholder="Search books or people" aria-label="Search books or people">
    </form>
    <!-- Links for everyone -->
    <a class="header-link" href="genres.html">Genres</a>
    <a class="header-link" href="popular.html">Popular</a>
    <!-- Books / Comics / Manga switch (js/auth.js). In Books it opens a
         little menu; in Comics and Manga it goes back to Books. -->
    <div class="universe-switch">
      <button id="universe-button" class="universe-button" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="universe-menu">
        <span class="u-away"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2l2 5 5-2-1.5 5L22 12l-4.5 2 1.5 5-5-2-2 5-2-5-5 2 1.5-5L2 12l4.5-2L5 5l5 2z"/></svg><span class="u-words">Comics &amp; Manga</span></span>
        <span class="u-home"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h14v15H6a2 2 0 0 0-2 2zM20 18v3H6"/></svg><span class="u-words">Back to Books</span></span>
      </button>
      <div id="universe-menu" class="universe-menu" role="menu" hidden>
        <button class="universe-option" type="button" role="menuitem" data-go-universe="comics"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2l2 5 5-2-1.5 5L22 12l-4.5 2 1.5 5-5-2-2 5-2-5-5 2 1.5-5L2 12l4.5-2L5 5l5 2z"/></svg><span>Enter Comic Mode<small>Graphic novels and comic books</small></span></button>
        <button class="universe-option" type="button" role="menuitem" data-go-universe="manga"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 3h18v18H3zM3 11h9M12 3v18M12 15h9"/></svg><span>Switch to Manga Mode<small>Manga, manhwa and webtoons</small></span></button>
      </div>
    </div>
    <!-- Day / night switch (js/auth.js) -->
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to day mode" title="Switch to day mode">
      <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <!-- Phones only: opens the menu (Genres, Popular, Settings, Log out, ...). js/auth.js -->
    <button id="menu-button" class="menu-button" type="button" aria-label="Menu" title="Menu" hidden>
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <!-- Filled in by js/auth.js: log in links, or your Profile / Settings / Log out buttons -->
    <nav id="site-nav" class="site-nav"></nav>
  </header>

  <main class="page">
    <p id="spotlight-status" class="status status-error" hidden></p>

    <!-- One spotlight with its comments open (js/spotlight.js) -->
    <div id="spotlight-box"><div class="skeleton-group" role="status" aria-label="Loading"><div class="skeleton-log" aria-hidden="true"><span class="skeleton sk-cover"></span><span class="sk-lines"><span class="skeleton sk-line sk-short"></span><span class="skeleton sk-line"></span><span class="skeleton sk-line"></span></span></div></div></div>
  </main>

  <footer class="site-footer">
    <nav class="footer-links" aria-label="About Reddle">
      <a href="about.html">About</a>
      <a href="picks.html">Books of the week</a>
      <a href="screen.html">Book to screen</a>
      <a href="news.html">Reading news</a>
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
      <a href="about.html#contact">Contact</a>
    </nav>
    <p class="footer-universe">
      <span class="u-away"><button class="link-button" type="button" data-go-universe="comics">Enter Comic Mode</button><button class="link-button" type="button" data-go-universe="manga">Switch to Manga Mode</button></span>
      <span class="u-home"><button class="link-button" type="button" data-go-universe="books">Back to Books</button></span>
    </p>
    <p class="footer-note">Book data and covers from <a href="https://openlibrary.org">Open Library</a> and <a href="https://books.google.com">Google Books</a>. Film and TV data from <a href="https://www.wikidata.org">Wikidata</a>.</p>
    <p class="footer-note">Headlines link to their original sites.</p>
  </footer>

  <!-- 1. Supabase library from a CDN (nothing to install) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <!-- 2. Our project URL and key -->
  <script src="js/config.js?v=67"></script>
  <!-- 3. Shared connection, available as `db` -->
  <script src="js/supabase-client.js?v=67"></script>
  <!-- 4. Login helpers, the header menu and shared helpers -->
  <script src="js/auth.js?v=67"></script>
  <!-- 4b. Genres, universes (Books, Comics, Manga), Open Library and Google Books -->
  <script src="js/sources.js?v=67"></script>
  <!-- 5. Live suggestions under the header search box -->
  <script src="js/search-suggest.js?v=67"></script>
  <!-- 5b. Curated comics and manga lists (fill lists while Reddle is small) -->
  <script src="js/universe-seeds.js?v=67"></script>
  <!-- 5c. Book to screen: films and series based on books (Wikidata files) -->
  <script src="js/screen-data.js?v=67"></script>
  <!-- 5d. Reading news: headlines from other sites (news-data/news.json) -->
  <script src="js/news-data.js?v=67"></script>
  <!-- 6. Book helpers: Open Library, stars, covers, log cards -->
  <script src="js/books.js?v=67"></script>
  <!-- 7. Picture cards to share (reviews, year in review) -->
  <script src="js/share-card.js?v=67"></script>
  <!-- 8. Posts, comments and likes on posts -->
  <script src="js/social.js?v=67"></script>
  <!-- This page's own code -->
  <script src="js/spotlight.js?v=67"></script>
</body>
</html>
