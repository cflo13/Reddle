<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set a new password · Reddle</title>
  <meta name="description" content="Choose a new password for your Reddle account.">
  <link rel="stylesheet" href="css/style.css?v=7">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">Reddle</a>
    <!-- Search box: goes to search.html?q=... -->
    <form class="header-search" action="search.html" role="search">
      <input name="q" type="search" placeholder="Search books or people" aria-label="Search books or people">
    </form>
    <!-- Filled in by js/auth.js: log in links, or your picture and menu -->
    <nav id="site-nav" class="site-nav"></nav>
  </header>

  <main class="page page-narrow">
    <h1>Set a new password</h1>

    <!-- Shown when the reset link worked -->
    <form id="reset-form" class="form" hidden>
      <label for="password">New password</label>
      <input id="password" type="password" autocomplete="new-password" required minlength="6">
      <p class="hint">At least 6 characters.</p>

      <label for="password-again">New password again</label>
      <input id="password-again" type="password" autocomplete="new-password" required minlength="6">

      <button type="submit" class="button">Save new password</button>
    </form>

    <p id="form-message" class="status status-waiting">Checking your reset link...</p>
  </main>

  <footer class="site-footer">
    <nav class="footer-links" aria-label="About Reddle">
      <a href="about.html">About</a>
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
      <a href="about.html#contact">Contact</a>
    </nav>
    <p class="footer-note">Book data and covers from <a href="https://openlibrary.org">Open Library</a>.</p>
  </footer>

  <!-- 1. Supabase library from a CDN (nothing to install) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <!-- 2. Our project URL and key -->
  <script src="js/config.js?v=7"></script>
  <!-- 3. Shared connection, available as `db` -->
  <script src="js/supabase-client.js?v=7"></script>
  <!-- 4. Login helpers, the header menu and shared helpers -->
  <script src="js/auth.js?v=7"></script>
  <!-- This page's own code -->
  <script src="js/reset-password.js?v=7"></script>
</body>
</html>
