# Refreshes the Reading news headlines (news-data/news.json) once a day
# from a few chosen sites' public feeds (headline, source, date, link
# only; see tools/make-news.mjs for the sources and why they're allowed).
# Also runs when the owner presses "Run workflow" on GitHub's Actions tab.
# Only commits when the headlines changed. No secrets.
name: Refresh reading news

on:
  schedule:
    - cron: "7 6 * * *"   # every day at 06:07 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read the news feeds
        run: node tools/make-news.mjs
      - name: Save it if it changed
        run: |
          if [ -z "$(git status --porcelain -- news-data)" ]; then
            echo "No change."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add news-data
            git commit -m "Refresh reading news"
            git pull --rebase
            git push
          fi
