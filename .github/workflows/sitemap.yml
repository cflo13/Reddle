# Refreshes sitemap.xml once a day (and whenever the owner presses
# "Run workflow" on GitHub's Actions tab). It only commits when the list of
# pages actually changed. Uses only the public Supabase key, which is
# already in js/config.js; no secrets needed.
name: Refresh sitemap

on:
  schedule:
    - cron: "17 4 * * *"   # every day at 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Make sitemap.xml
        run: node tools/make-sitemap.mjs
      - name: Save it if it changed
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "No change."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "Refresh sitemap"
            git push
          fi
