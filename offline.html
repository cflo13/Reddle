<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#14181c">
  <title>You're offline · Reddle</title>
  <!-- Shown by sw.js when there's no internet. Everything is inside this
       file (no links to other files), because it can be shown at any
       address, like u/maria. -->
  <script>
    // Day or night, like the rest of the site.
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("reddle-theme"); } catch (e) {}
      var light = saved ? saved === "light" : !!(window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches);
      if (light) document.documentElement.className = "light";
    })();
  </script>
  <style>
    :root { --bg: #14181c; --text: #e6e9ec; --muted: #9aa5b1; --tile: #1f262d; --button: #00c030; }
    :root.light { --bg: #f4ecd8; --text: #3b2a1f; --muted: #74604d; --tile: #fbf6e9; --button: #2e7d32; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      box-sizing: border-box;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      text-align: center;
    }
    h1 { font-size: 1.5rem; margin: 16px 0 8px; }
    p { color: var(--muted); margin: 0 0 20px; }
    button {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: var(--button);
      color: #ffffff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
      <rect width="64" height="64" rx="14" fill="#14181c"/>
      <rect x="13" y="14" width="10" height="36" rx="2.5" fill="#00c030"/>
      <rect x="27" y="10" width="10" height="40" rx="2.5" fill="#40bcf4"/>
      <rect x="42" y="13" width="10" height="38" rx="2.5" fill="#ff8a3d" transform="rotate(12 47 50)"/>
      <rect x="10" y="50" width="44" height="4" rx="2" fill="#e6e9ec"/>
    </svg>
    <h1>You're offline</h1>
    <p>Reddle needs the internet to load books and reviews.<br>Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
