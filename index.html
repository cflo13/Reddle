<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reddle</title>
  <meta name="description" content="Track the books you read, rate and review them, and see what your friends are reading.">
  <link rel="stylesheet" href="css/style.css?v=7">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">Reddle</a>
    <!-- Search box: goes to search.html?q=... -->
    <form class="header-search" action="search.html" role="search">
      <input name="q" type="search" placeholder="Search books or people" aria-label="Search books or people">
    </form>
    <!-- Filled in by js/auth.js: log in links, or your picture and menu -->
    <nav id="site-nav" class="site-nav"></nav>
  </header>

  <main class="page">
    <!-- Only shown when logged out -->
    <section id="welcome" class="welcome" hidden>
      <h1>Track the books you read.</h1>
      <p class="lead">Log books, rate them, write reviews, and follow your friends.</p>
      <p>
        <a class="button" href="signup.html">Get started, it's free</a>
        <a class="welcome-login" href="login.html">or log in</a>
      </p>
    </section>

    <!-- Shown after someone deletes their account -->
    <p id="deleted-message" class="status status-ok" hidden>Your account and everything in it has been deleted. Thanks for reading with us.</p>

    <p id="home-status" class="status status-error" hidden></p>

    <h2 id="feed-heading">Loading...</h2>
    <p id="feed-note" class="muted" hidden></p>
    <!-- Filled in by js/home.js -->
    <div id="feed" class="log-list"></div>
  </main>

  <footer class="site-footer">
    <nav class="footer-links" aria-label="About Reddle">
      <a href="about.html">About</a>
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
      <a href="about.html#contact">Contact</a>
    </nav>
    <p class="footer-note">Book data and covers from <a href="https://openlibrary.org">Open Library</a>.</p>
  </footer>

  <!-- 1. Supabase library from a CDN (nothing to install) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <!-- 2. Our project URL and key -->
  <script src="js/config.js?v=7"></script>
  <!-- 3. Shared connection, available as `db` -->
  <script src="js/supabase-client.js?v=7"></script>
  <!-- 4. Login helpers, the header menu and shared helpers -->
  <script src="js/auth.js?v=7"></script>
  <!-- 5. Book helpers: Open Library, stars, covers, log cards -->
  <script src="js/books.js?v=7"></script>
  <!-- This page's own code -->
  <script src="js/home.js?v=7"></script>
</body>
</html>
