<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin · Reddle</title>
  <meta name="description" content="Reddle moderation.">
  <link rel="stylesheet" href="css/style.css?v=10">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">Reddle</a>
    <!-- Search box: goes to search.html?q=... -->
    <form class="header-search" action="search.html" role="search">
      <input name="q" type="search" placeholder="Search books or people" aria-label="Search books or people">
    </form>
    <!-- Filled in by js/auth.js: log in links, or your picture and menu -->
    <nav id="site-nav" class="site-nav"></nav>
  </header>

  <main class="page">
    <h1>Admin</h1>
    <p id="admin-status" class="muted">Checking...</p>

    <section id="admin-area" hidden>
      <p class="lead">Open reports, newest first. Removing a review or user also clears its reports.</p>
      <p id="admin-message" class="status" hidden></p>
      <!-- Filled in by js/admin.js -->
      <div id="reports" class="report-list"></div>
    </section>
  </main>

  <footer class="site-footer">
    <nav class="footer-links" aria-label="About Reddle">
      <a href="about.html">About</a>
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
      <a href="about.html#contact">Contact</a>
    </nav>
    <p class="footer-note">Book data and covers from <a href="https://openlibrary.org">Open Library</a>.</p>
  </footer>

  <!-- 1. Supabase library from a CDN (nothing to install) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <!-- 2. Our project URL and key -->
  <script src="js/config.js?v=10"></script>
  <!-- 3. Shared connection, available as `db` -->
  <script src="js/supabase-client.js?v=10"></script>
  <!-- 4. Login helpers, the header menu and shared helpers -->
  <script src="js/auth.js?v=10"></script>
  <!-- 5. Book helpers: Open Library, stars, covers, log cards -->
  <script src="js/books.js?v=10"></script>
  <!-- This page's own code -->
  <script src="js/admin.js?v=10"></script>
</body>
</html>
