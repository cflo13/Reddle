<!DOCTYPE html>

  <meta charset="UTF-8">
  <script>
    // Where the site lives: on github.io it's in a folder (/Reddle/),
    // on our own domain it's the top (/).
    (function () {
      var parts = location.pathname.split("/").filter(Boolean);
      var root = location.hostname.endsWith("github.io") && parts.length ? "/" + parts[0] + "/" : "/";
      window.SITE_ROOT = root;
      document.write('<base href="' + root + '">');
      // Clean addresses: u/NAME is a profile, book/ID a book, author/ID an author.
      var rest = location.pathname.slice(root.length).split("/");
      var pages = { u: "profile.html", book: "book.html", author: "author.html", diary: "diary.html" };
      if (pages[rest[0]] && rest[1]) {
        window.CLEAN_ROUTE = pages[rest[0]];
        document.write("<style>body { visibility: hidden; }</style>");
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <script>
    // Day or night colours, before anything is drawn (so no flash):
    // your saved choice, otherwise the device setting. js/auth.js has the switch.
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("reddle-theme"); } catch (e) {}
      var light = saved ? saved === "light" : !!(window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches);
      document.documentElement.setAttribute("data-theme", light ? "light" : "dark");
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", light ? "#fbf5e6" : "#271f1a");
    })();
  </script>
