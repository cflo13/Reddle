<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- This page can appear at any address, so links start from the site folder -->
  <base href="/Reddle/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found · Reddle</title>
  <meta name="robots" content="noindex">
  <meta name="description" content="This page does not exist on Reddle.">
  <!-- Icon in the browser tab and on phone home screens -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="images/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <meta name="theme-color" content="#14181c">
  <!-- The preview shown when a link is shared (WhatsApp, Instagram, iMessage...) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Reddle">
  <meta property="og:title" content="Page not found · Reddle">
  <meta property="og:description" content="This page does not exist on Reddle.">
  <meta property="og:url" content="https://cflo13.github.io/Reddle/404.html">
  <meta property="og:image" content="https://cflo13.github.io/Reddle/images/share.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Reddle: track the books you read">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="css/style.css?v=16">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html"><img src="favicon.svg" alt="" width="28" height="28">Reddle</a>
    <!-- Search box: goes to search.html?q=... -->
    <form class="header-search" action="search.html" role="search">
      <input name="q" type="search" placeholder="Search books or people" aria-label="Search books or people">
    </form>
    <!-- Filled in by js/auth.js: log in links, or your picture and menu -->
    <nav id="site-nav" class="site-nav"></nav>
  </header>

  <main class="page empty-state">
    <h1>Page not found</h1>
    <p class="lead">The link might be broken, or the page may have moved.</p>
    <form class="form search-form not-found-search" action="search.html" role="search">
      <input name="q" type="search" placeholder="Search for a book or a person" aria-label="Search">
      <button type="submit" class="button">Search</button>
    </form>
    <p><a href="index.html">Go to the home page</a></p>
  </main>

  <footer class="site-footer">
    <nav class="footer-links" aria-label="About Reddle">
      <a href="about.html">About</a>
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
      <a href="about.html#contact">Contact</a>
    </nav>
    <p class="footer-note">Book data and covers from <a href="https://openlibrary.org">Open Library</a>.</p>
  </footer>

  <!-- 1. Supabase library from a CDN (nothing to install) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <!-- 2. Our project URL and key -->
  <script src="js/config.js?v=16"></script>
  <!-- 3. Shared connection, available as `db` -->
  <script src="js/supabase-client.js?v=16"></script>
  <!-- 4. Login helpers, the header menu and shared helpers -->
  <script src="js/auth.js?v=16"></script>
  <!-- This page's own code -->
  <script src="js/static-page.js?v=16"></script>
</body>
</html>
